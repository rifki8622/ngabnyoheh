<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pembayaran Berhasil</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: Inter, system-ui, sans-serif;
    background:
      repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.03),
        rgba(255,255,255,.03) 1px,
        transparent 1px,
        transparent 40px
      ),
      #020617;
    color: #e5e7eb;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .box {
    background: rgba(2,6,23,.75);
    border: 1px solid rgba(255,255,255,.08);
    padding: 30px;
    border-radius: 20px;
    width: 340px;
    text-align: center;
    backdrop-filter: blur(10px);
  }

  .check {
    font-size: 48px;
    margin-bottom: 10px;
  }

  .detail {
    margin-top: 20px;
    text-align: left;
    font-size: 13px;
    background: rgba(255,255,255,.05);
    padding: 15px;
    border-radius: 12px;
  }

  .detail div {
    margin-bottom: 8px;
  }

  a {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 16px;
    background: #fff;
    color: #020617;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="box">
  <div class="check">✓</div>
  <h2>Pembayaran Diproses</h2>
  <p style="font-size:13px;color:#9ca3af;">
    Silakan selesaikan pembayaran Anda
  </p>

  <div class="detail">
    <div><b>Order ID</b>: <span id="order"></span></div>
    <div><b>Nominal</b>: Rp <span id="amount"></span></div>
    <div><b>Status</b>: Menunggu konfirmasi</div>
  </div>

  <a href="/">Kembali</a>
</div>

<script>
const q = new URLSearchParams(window.location.search)
document.getElementById("order").innerText = q.get("order_id") || "-"
document.getElementById("amount").innerText = q.get("amount") || "-"
</script>

</body>
</html>
