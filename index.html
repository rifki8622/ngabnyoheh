<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SOHEH PAYMENT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: #e5e7eb;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.05), transparent 40%),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.035) 0,
        rgba(255,255,255,.035) 1px,
        transparent 1px,
        transparent 40px
      ),
      repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.03) 0,
        rgba(255,255,255,.03) 1px,
        transparent 1px,
        transparent 40px
      ),
      #020617;
  }

  .card {
    width: 360px;
    padding: 28px;
    border-radius: 18px;
    background: rgba(2, 6, 23, .75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 30px 60px rgba(0,0,0,.6);
  }

  .title {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .5px;
  }

  .sub {
    text-align: center;
    font-size: 13px;
    color: #9ca3af;
    margin: 6px 0 22px;
  }

  label {
    font-size: 12px;
    color: #9ca3af;
  }

  input, select {
    width: 100%;
    margin-top: 6px;
    margin-bottom: 18px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: #020617;
    color: #fff;
    outline: none;
  }

  input:focus, select:focus {
    border-color: rgba(255,255,255,.2);
  }

  button {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(180deg, #fff, #e5e7eb);
    color: #020617;
    font-weight: 600;
    cursor: pointer;
    transition: .2s ease;
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 25px rgba(255,255,255,.15);
  }

  .footer {
    margin-top: 18px;
    text-align: center;
    font-size: 11px;
    color: #6b7280;
  }
</style>
</head>
<body>

<div class="card">
  <div class="title">Soheh Payment</div>
  <div class="sub">Secure & simple checkout</div>

  <label>Nominal (Rp)</label>
  <input type="number" id="amount" placeholder="2000" min="1000">

  <label>Metode Pembayaran</label>
  <select id="method">
    <option value="all">All Metode</option>
    <option value="qris">QRIS Only</option>
  </select>

  <button onclick="pay()">Bayar Sekarang</button>

  <div class="footer">
    Powered by payment shoheh
  </div>
</div>

<script>
function pay() {
  const amount = document.getElementById("amount").value
  const method = document.getElementById("method").value

  if (!amount || amount < 1000) {
    alert("Nominal tidak valid")
    return
  }

  const slug = "shoheh-project"
  const orderId = "SOHEH-" + Date.now()

  let url = `https://app.pakasir.com/pay/${slug}/${amount}?order_id=${orderId}`

  if (method === "qris") {
    url += "&qris_only=1"
  }

  url += "&redirect=" + encodeURIComponent(
    window.location.origin + "/sukses.html"
  )

  window.location.href = url
}
</script>

</body>
</html>
